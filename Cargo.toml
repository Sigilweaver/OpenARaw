[workspace]
resolver = "2"
members = ["crates/openaraw", "crates/openaraw-py"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenARaw"
homepage = "https://sigilweaver.app/openaraw/"
documentation = "https://sigilweaver.app/openaraw/docs/"
keywords = ["mass-spectrometry", "agilent", "masshunter", "raw", "proteomics"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
openaraw = { path = "crates/openaraw" }
openmassspec-core = "4.0.0"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Core 4.0.0 is not on crates.io yet. Remove this section when it is.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "63b2a3010abea9d2bfd7a74c9e9a413b6a1ade39" }
