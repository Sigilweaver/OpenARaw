# CI for OpenARaw.
#
# Jobs:
#   build - cargo fmt --check, cargo clippy -D warnings, cargo test
#           (Linux + macOS + Windows, mirroring publish.yml's wheel matrix).
#           Downloads small QQQ (MRM) and QTOF .d.zip fixtures from PRIDE
#           and unzips them ahead of `cargo test` so
#           crates/openaraw/tests/conformance.rs's test_qqq_conformance and
#           test_qtof_conformance exercise real decode paths instead of
#           skipping - see Sigilweaver/OpenARaw#20 and #28.
#   semver-checks - cargo-semver-checks on openaraw against its latest
#           crates.io release (Linux only).
#
# Unlike OpenTFRaw's single-file .raw fixture, the corpus this reader
# validates against is whole .d *directories*, which PRIDE does not expose
# as a single stable download URL the way it does individual Thermo .raw
# files - PRIDE submitters instead upload a `.d.zip` archive of the whole
# bundle, so the download step below also unzips it before tests run.
# The QTOF fixture (PXD030293/180814-Sample19.d, ~960 KB zipped) replaced
# the previous ~247 MB QTOF candidate (PXD004426/20140806_TgAAL.d) that was
# too large for routine CI download - see CORPUS.md.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Small QQQ (MRM) bundle (~9 MB unpacked, ~1.6 MB zipped) from PRIDE
  # PXD004747, used as the CI corpus-download fixture for
  # crates/openaraw/tests/conformance.rs. URL is stable because PRIDE uses
  # year/month archive paths.
  PRIDE_DZIP_URL: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/03/PXD004747/Cdc19_ubp2_AQUA.d.zip
  PRIDE_DZIP_FALLBACK_URL: >-
    https://ftp.ebi.ac.uk/pride/data/archive/2022/03/PXD004747/Cdc19_ubp2_AQUA.d.zip
  PRIDE_DZIP_SHA256: dae9f50531d3a0645a5f98931d57c3998da8ff8227df5fd9ff3001321575fab3
  CORPUS_DZIP_NAME: Cdc19_ubp2_AQUA.d.zip
  # Small QTOF (Agilent 6550) bundle (~3 MB unpacked, ~960 KB zipped) from
  # PRIDE PXD030293, used as the CI corpus-download fixture for
  # crates/openaraw/tests/conformance.rs's test_qtof_conformance - see
  # Sigilweaver/OpenARaw#28.
  PRIDE_DZIP_URL_QTOF: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/07/PXD030293/180814-Sample19.d.zip
  PRIDE_DZIP_QTOF_FALLBACK_URL: >-
    https://ftp.ebi.ac.uk/pride/data/archive/2022/07/PXD030293/180814-Sample19.d.zip
  PRIDE_DZIP_QTOF_SHA256: 54309c9f6bdc20f846a278fad2bad0f0500e0689294a8d2135c1db6392c755d1
  CORPUS_DZIP_NAME_QTOF: 180814-Sample19.d.zip
  # Keep these directory names in sync with
  # crates/openaraw/tests/conformance.rs's qqq_fixture()/qtof_fixture()
  # candidates.
  CORPUS_DIR: corpus

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Fetch corpus fixtures for conformance tests
        timeout-minutes: 20
        uses: Sigilweaver/ops/.github/actions/fetch-fixture@cf88ab9d4e06ce360ee0659bde8d10081ea4de17
        with:
          destination: ${{ env.CORPUS_DIR }}
          user-agent: OpenARaw-CI/1.0
          fixtures: |
            ${{ env.CORPUS_DZIP_NAME }} ${{ env.PRIDE_DZIP_SHA256 }} ${{ env.PRIDE_DZIP_URL }} ${{ env.PRIDE_DZIP_FALLBACK_URL }}
            ${{ env.CORPUS_DZIP_NAME_QTOF }} ${{ env.PRIDE_DZIP_QTOF_SHA256 }} ${{ env.PRIDE_DZIP_URL_QTOF }} ${{ env.PRIDE_DZIP_QTOF_FALLBACK_URL }}

      - name: Extract corpus fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unzip -q "$CORPUS_DIR/$CORPUS_DZIP_NAME" -d "$CORPUS_DIR"
          unzip -q "$CORPUS_DIR/$CORPUS_DZIP_NAME_QTOF" -d "$CORPUS_DIR"

      - name: Extract corpus fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "$env:CORPUS_DIR/$env:CORPUS_DZIP_NAME" -DestinationPath "$env:CORPUS_DIR"
          Expand-Archive -Path "$env:CORPUS_DIR/$env:CORPUS_DZIP_NAME_QTOF" -DestinationPath "$env:CORPUS_DIR"

      - name: cargo test
        # Fixtures were downloaded above, so a missing one is a failure,
        # not a skip.
        env:
          REQUIRE_CORPUS: "1"
        run: cargo test --workspace --all-targets

      - name: Python binding parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.5,<2' pytest
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          REQUIRE_CORPUS=1 OPENARAW_TEST_BUNDLE=corpus/180814-Sample19.d .venv/bin/python -m pytest tests/test_bindings.py -v

  docs-validation:
    name: Shared docs validation
    permissions:
      contents: read
    uses: Sigilweaver/ops/.github/workflows/docs.yml@757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
    with:
      tooling-ref: 757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
  docs:
    name: Docs (Docusaurus)
    needs: docs-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DOCS_RESULT: ${{ needs.docs-validation.result }}
    steps:
      - run: test "$DOCS_RESULT" = success
  # Public API compatibility of the crates.io-published crate against its
  # latest published version. A breaking change without a matching version
  # bump fails; a deliberate major bump passes. OS-independent, so Linux only.
  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: openaraw
